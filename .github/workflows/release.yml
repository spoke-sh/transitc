name: Prepare release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main push CI run containing all four signed archives
        required: true
        type: string
      tag:
        description: Existing tag matching that source and its packaged version (vVERSION)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify qualified archives and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tasks/release.py --run-id "$RELEASE_RUN_ID" --tag "$RELEASE_TAG"
