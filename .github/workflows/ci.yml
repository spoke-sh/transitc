name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check compiler, source verification and upstream parity
        run: nix flake check --print-build-logs
      - name: Execute source grammar and typed correspondence checks
        run: nix build .#checks.x86_64-linux.source --no-link --print-build-logs
      - run: nix develop --command just check
      - run: nix develop --command just test::clean-build
      - run: nix develop --command just test::fmt test::workspace test::examples test::integration test::build-command test::command
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#docs --command just docs::install
      - run: nix develop .#docs --command just docs::check
      - run: nix develop .#docs --command env TRANSITC_DOCS_BASE_URL=/ just docs::build
